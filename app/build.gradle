buildscript {
    repositories {
        maven { url 'https://maven.fabric.io/public' }
    }

    dependencies {
        classpath 'io.fabric.tools:gradle:1.+'
    }
}
apply plugin: 'com.android.application'
apply plugin: 'io.fabric'

repositories {
    maven { url 'https://maven.fabric.io/public' }
}


android {
    compileSdkVersion project.ANDROID_BUILD_SDK_VERSION
    buildToolsVersion project.ANDROID_BUILD_TOOLS_VERSION
    defaultConfig {
        applicationId "com.sdrive.workshop.app"
        minSdkVersion project.ANDROID_BUILD_MIN_SDK_VERSION
        targetSdkVersion project.ANDROID_BUILD_TARGET_SDK_VERSION
        versionCode 12
        versionName "1.12"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        flavorDimensions "environment"
    }

    signingConfigs {
        release {
            storeFile file("TestKeystore.keystore")
            storePassword "Creatah"
            keyAlias "CreatahApps"
            keyPassword "Creatah"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    //ProductFlavors Based on Environment
    productFlavors {

        DEV {
            resValue "string", "app_name", "Dev - SDrive Workshop"
            applicationIdSuffix ".dev"
            dimension "environment"
            ext {
                server = [debug: 1, release: 1]
            }
        }


        STAGING {
            resValue "string", "app_name", "Demo - SDrive Workshop"
            applicationIdSuffix ".demo"
            dimension "environment"
            ext {
                server = [debug: 2, release: 2]
            }
        }


        PROD {
            resValue "string", "app_name", "SDrive Workshop"
            dimension "environment"
            ext {
                server = [debug: 3, release: 3]
            }
        }


        applicationVariants.all { variant ->
            def flavor = variant.productFlavors[0]
            println "Setting up server URL ${flavor.ext.server[variant.buildType.name]} for variant [${variant.name}]"
            variant.buildConfigField "int", "SERVER_MODE", "${flavor.ext.server[variant.buildType.name]}"

        }
    }

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support:support-v4:28.0.0'
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    implementation 'android.arch.navigation:navigation-fragment:1.0.0'
    implementation 'android.arch.navigation:navigation-ui:1.0.0'
    androidTestImplementation('com.android.support.test.espresso:espresso-core:2.2.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    //noinspection GradleCompatible
    implementation 'com.android.support:appcompat-v7:' + project.SUPPORT_VERSION
    implementation 'com.google.android.gms:play-services-gcm:' + project.GOOGLE_SERVICE_VERSION
    implementation 'com.google.android.gms:play-services-maps:' + project.GOOGLE_SERVICE_VERSION
    testImplementation 'junit:junit:4.12'
    implementation project(':theme')
    implementation 'com.android.support:cardview-v7:' + project.SUPPORT_VERSION

    implementation 'com.jakewharton:butterknife:8.7.0'
    annotationProcessor 'com.jakewharton:butterknife-compiler:8.7.0'
}
