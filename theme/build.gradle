apply plugin: 'com.android.library'

android {
    compileSdkVersion project.ANDROID_BUILD_SDK_VERSION
    buildToolsVersion project.ANDROID_BUILD_TOOLS_VERSION

    defaultConfig {
        minSdkVersion project.ANDROID_BUILD_MIN_SDK_VERSION
        targetSdkVersion project.ANDROID_BUILD_TARGET_SDK_VERSION
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

}

dependencies {
    api fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.12'
    api project(':commonframework')
    api 'com.android.support:appcompat-v7:'+project.SUPPORT_VERSION
    api 'com.android.support:recyclerview-v7:'+project.SUPPORT_VERSION
    //noinspection GradleCompatible
    api 'com.android.support:support-v4:'+project.SUPPORT_VERSION
    api 'com.android.support:design:'+project.SUPPORT_VERSION
    api 'com.google.android.gms:play-services-auth:'+project.GOOGLE_SERVICE_VERSION
    api 'com.facebook.android:facebook-android-sdk:4.0.0'
    api 'com.nineoldandroids:library:2.4.0'
    api 'com.nostra13.universalimageloader:universal-image-loader:1.9.5'
    api 'com.theartofdev.edmodo:android-image-cropper:1.2.+'
    api 'com.android.support:cardview-v7:'+project.SUPPORT_VERSION
    api 'uk.co.chrisjenx:calligraphy:2.2.0' // Custom Font
    api 'de.greenrobot:eventbus:2.4.0'// Communication bus


}
